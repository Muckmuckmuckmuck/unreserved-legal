# Hourly health check for the Unreserved backend (docs/OPERATIONS.md in the app repo).
# It lives in this public repo because Actions minutes are free for public repos.
# GitHub emails the repo owner when a scheduled run fails.
#
# Turn it on: Settings → Secrets and variables → Actions → add SUPABASE_URL and SUPABASE_ANON_KEY
# (the anon key is the public one the app ships with; never add the service role key here).
name: Health check
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the backend whether it's healthy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::Add the SUPABASE_URL and SUPABASE_ANON_KEY secrets to turn on the health check."
            exit 0
          fi
          status=$(curl -sS -o body.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/functions/v1/health" || echo 000)
          cat body.json 2>/dev/null; echo
          if [ "$status" != "200" ]; then
            echo "::error::Unreserved is unhealthy (HTTP $status). See docs/OPERATIONS.md."
            exit 1
          fi
